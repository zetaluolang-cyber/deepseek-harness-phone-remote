# CI: lint (syntax), unit/security tests, deploy/ownership tests, packaging.
# Kept deliberately light — no heavyweight framework, just node:test + node --check.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check every lib file (lint)
        run: |
          find remfs-persistent/lib -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check remfs-persistent/scripts/dogfood-board.js
          node --check remfs-persistent/scripts/dump-session.js
          node --check remfs-persistent/scripts/demo-presence.js
      - name: All node tests (automatic discovery, zero-test guard)
        run: |
          cd remfs-persistent
          OUT=$(node --test 2>&1)
          echo "$OUT"
          COUNT=$(echo "$OUT" | grep -oP '[#ℹ] tests \K\d+' | head -1)
          echo "tests executed: ${COUNT:-0}"
          if [ -z "$COUNT" ] || [ "$COUNT" -lt 140 ]; then
            echo "::error::zero/suspicious test count (expected >= 140, got ${COUNT:-0}) - CI must never silently omit test files"
            exit 1
          fi
      - name: No maintainer-specific paths in deploy scripts
        shell: pwsh
        run: |
          $files = @('install.ps1', 'keep_awake.ps1', 'restart_harness.ps1', 'restart_harness_once.ps1', 'stop_harness.ps1', 'start_harness.template.ps1', 'harness-common.ps1', 'refresh_pairing.ps1', 'watchdog.ps1', 'test/installer-patch.integration.ps1')
          $bad = @()
          foreach ($f in $files) {
            $hits = Select-String -Path $f -Pattern 'C:\\Users\\[A-Za-z]' -ErrorAction SilentlyContinue
            if ($hits) { $bad += "$f : " + (($hits | ForEach-Object { $_.LineNumber }) -join ',') }
          }
          if ($bad.Count -gt 0) { Write-Error "Maintainer-specific C:\Users\<name> paths found: $($bad -join '; ')"; exit 1 }
      - name: PowerShell syntax check (every .ps1, auto-discovered)
        shell: pwsh
        run: |
          # Auto-discovery, not a hand-written list: the previous list had
          # already gone stale and omitted scripts/orb-widget.ps1 - the one
          # file in this repo with a history of parse-time bugs (see
          # 76ecca9, "New-Object Type(expr) mis-parses binary operators").
          $files = Get-ChildItem -Path . -Recurse -Filter *.ps1 |
            Where-Object { $_.FullName -notmatch '\\node_modules\\' }
          if ($files.Count -lt 12) {
            Write-Error "suspicious .ps1 count ($($files.Count)) - discovery regression"; exit 1
          }
          Write-Host "parsing $($files.Count) PowerShell files"
          $bad = 0
          foreach ($f in $files) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs.Count -gt 0) {
              Write-Host "::error::$($f.FullName) parse errors: $($errs.Count)"
              foreach ($e in $errs) { Write-Host "  $($e.Extent.StartLineNumber): $($e.Message)" }
              $bad++
            }
          }
          if ($bad -gt 0) { Write-Error "$bad file(s) failed to parse"; exit 1 }

  windows-deploy-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deployment smoke test
        shell: pwsh
        run: ./test/install-smoke.ps1
      - name: Desktop companion runtime smoke test
        shell: powershell
        run: ./scripts/orb-widget.ps1 -SmokeTest -Quiet
      - name: Orb state-decision logic test (fresh/stale cache, auth, toast gate)
        shell: powershell
        run: ./test/orb-state.test.ps1
      - name: Clean-user one-click install (isolated profile, offline DSH fixture)
        shell: powershell
        run: ./test/clean-install.integration.ps1
      - name: Launcher ownership regression (dummy :3080 + owned-kill)
        shell: pwsh
        run: ./test/launcher-ownership.ps1
      - name: Syntax check every lib file on Windows
        run: |
          Get-ChildItem remfs-persistent/lib -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: All node tests on Windows (automatic discovery, zero-test guard)
        run: |
          cd remfs-persistent
          $OUT = node --test 2>&1 | Out-String
          Write-Host $OUT
          $m = [regex]::Match($OUT, '[#ℹ] tests (\d+)')
          $count = if ($m.Success) { [int]$m.Groups[1].Value } else { 0 }
          Write-Host "tests executed: $count"
          if ($count -lt 140) { Write-Error "zero/suspicious test count (expected >= 140, got $count)"; exit 1 }

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pack the plugin
        run: |
          cd remfs-persistent
          npm pack --silent
      - name: Install the tarball into a scratch project
        run: |
          cd remfs-persistent
          TARBALL=$(ls *.tgz | head -1)
          mkdir -p /tmp/scratch && cd /tmp/scratch
          npm init -y >/dev/null 2>&1
          npm install "$OLDPWD/$TARBALL" >/dev/null 2>&1 || npm install "$PWD/../../$TARBALL" >/dev/null 2>&1
          ls node_modules/@zetaluolang/remfs-persistent/lib/
          node -e "const s = require('./node_modules/@zetaluolang/remfs-persistent/lib/security.js'); console.log('security module ok, exports:', Object.keys(s).length)"

  # 65c52ca audit item 6 + b3dfc4b audit item 1 (P0): prove the plugin ACTUALLY
  # LOADS in a real, current DeepSeek Harness using the REAL installer patch
  # logic. The isolated node tests prove the logic; this job runs the shared
  # installer helper (Set-RemfsPatchRow from harness-common.ps1 - the same
  # function install.ps1 calls, which MIGRATES old rows and writes the
  # four-service inject), then boots a REAL `dsh web` against the generated
  # profile and asserts the /remfs channel registered. It must NOT hand-write a
  # different, idealized patch - CI tests the actual installer path.
  real-dsh-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install current @deepseek-ai/dsh
        run: npm i -g @deepseek-ai/dsh
      - name: Installer-patch integration (fresh + old-row migration + real-DSH boot)
        shell: pwsh
        run: ./test/installer-patch.integration.ps1
        env:
          DSH_BIN: /usr/local/bin/dsh

  # 65c52ca audit item 6 (non-blocking): DSH is a developer preview and
  # explicitly allows compatibility-breaking changes. This job re-runs the
  # same smoke against the 'next' dist-tag (the preview channel) and is
  # NON-BLOCKING: it warns when upstream's next breaks our plugin without
  # failing the suite. It uses continue-on-error so a red result here is a
  # heads-up, not a gate.
  real-dsh-smoke-upstream:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dsh from the upstream 'next' channel
        run: npm i -g @deepseek-ai/dsh@next
      - name: Installer-patch integration (non-blocking, upstream next)
        shell: pwsh
        run: ./test/installer-patch.integration.ps1
        env:
          DSH_BIN: /usr/local/bin/dsh

